name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name PyRW-Windows main.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: speedtester-windows
        path: dist/PyRW-Windows.exe
